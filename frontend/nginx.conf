# Published routing for the same-origin frontend.
# The Nov 7 capture replaced private upstreams with one placeholder and dropped
# the terminating semicolons. These proxy_pass targets are the in-cluster
# Service names from the existing movie-api namespace, not those placeholders.
# API routes -> Service/movie-api:8000. Object routes -> Service/minio:9000.
# Confirm both before replacing the live movie-frontend ConfigMap.

map $http_cf_connecting_ip $movie_client_key {
  ""      $binary_remote_addr;
  default $http_cf_connecting_ip;
}
limit_req_zone $movie_client_key zone=movie_refresh:1m rate=3r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store" always;

  # API — same-origin for the browser
  location ~ ^/(search|stats|health)(/|$) {
    proxy_pass http://movie-api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /sync stays internal-only (call the movie-api Service directly)
  location ~ ^/sync(/|$) {
    return 404;
  }

  # rate-limit the Ollama refresh endpoint (3/min/IP, burst 2)
  location ~ ^/movie/[0-9]+/refresh/?$ {
    limit_req zone=movie_refresh burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://movie-api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /movie/ {
    proxy_pass http://movie-api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /movies/tier/ {
    proxy_pass http://movie-api:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Batch uploads {tier}-movies.json to the movies bucket. Fall back to a
  # co-located file if MinIO is unreachable. The live upstream host was
  # redacted; this uses the minio Service and the bucket path the uploader
  # publishes ({endpoint}/{bucket}/{key}).
  location ~ ^/(theaters|popular|recent|on-demand)-movies\.json$ {
    rewrite ^/(.*)$ /movies/$1 break;
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_connect_timeout 4s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @local_json;
  }

  location @local_json {
    root /usr/share/nginx/html;
  }

  location /movies/ {
    proxy_pass http://minio:9000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
  }

  location /tmdb-image/ {
    proxy_pass https://image.tmdb.org/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
    proxy_set_header Host image.tmdb.org;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
}
