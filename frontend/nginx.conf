# Same-origin frontend routing. proxy_pass targets match the verified live
# ConfigMap: movie-api Service port 8000 (2 ready endpoints) and minio Service
# port 9000 (1 ready endpoint). Catalog objects live in bucket "movies".
# Do not drop the four movie-frontend-html catalog keys on rollout; the
# saved rollback copy omits them. This file is not a byte copy of the live
# ConfigMap (that file was sanitized before export).

# Key the refresh limit on the TCP peer. CF-Connecting-IP is client-supplied
# on the NodePort path, so it is not a trusted client identity here.
limit_req_zone $binary_remote_addr zone=movie_refresh:1m rate=3r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control "no-store" always;

  # API — same-origin for the browser
  location ~ ^/(search|stats|health)(/|$) {
    proxy_pass http://movie-api.movie-api.svc.cluster.local:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /sync stays internal-only (call the movie-api Service directly)
  location ~ ^/sync(/|$) {
    return 404;
  }

  # rate-limit the Ollama refresh endpoint (3/min/IP, burst 2)
  location ~ ^/movie/[0-9]+/refresh/?$ {
    limit_req zone=movie_refresh burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://movie-api.movie-api.svc.cluster.local:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /movie/ {
    proxy_pass http://movie-api.movie-api.svc.cluster.local:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /movies/tier/ {
    proxy_pass http://movie-api.movie-api.svc.cluster.local:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bucket movies objects: theaters|popular|recent|on-demand-movies.json.
  # Fall back to the ConfigMap file if MinIO does not answer.
  location ~ ^/(theaters|popular|recent|on-demand)-movies\.json$ {
    rewrite ^ /movies/$1-movies.json break;
    proxy_pass http://minio.movie-api.svc.cluster.local:9000;
    proxy_http_version 1.1;
    proxy_connect_timeout 4s;
    proxy_read_timeout 10s;
    proxy_set_header Host $host;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @local_json;
  }

  location @local_json {
    root /usr/share/nginx/html;
  }

  location /movies/ {
    proxy_pass http://minio.movie-api.svc.cluster.local:9000/movies/;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
  }

  location /tmdb-image/ {
    proxy_pass https://image.tmdb.org/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
    proxy_set_header Host image.tmdb.org;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store" always;
  }
}
