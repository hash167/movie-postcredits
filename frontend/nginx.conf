# Same-origin reverse proxy for the movie post-credits frontend.
# Phone clients should hit this origin only (no extra NodePorts).
#
# Kubernetes service names: movie-api:8000, minio:9000
# Override with API_UPSTREAM / MINIO_UPSTREAM if needed via a generated conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend static files (HTML/JS). Prefer MinIO for *-movies.json.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API
    location = /search {
        proxy_pass http://movie-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stats {
        proxy_pass http://movie-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://movie-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /movie/ {
        proxy_pass http://movie-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /movies/tier/ {
        proxy_pass http://movie-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO bucket (theaters-movies.json, popular-movies.json, ...)
    location /movies/ {
        proxy_pass http://minio:9000/movies/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # Also serve *-movies.json at the site root (fallback to MinIO export)
    location ~ ^/(theaters|popular|recent|on-demand)-movies\.json$ {
        proxy_pass http://minio:9000/movies/$1-movies.json;
        proxy_set_header Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # TMDB posters via same origin
    location /tmdb-image/ {
        proxy_pass https://image.tmdb.org/;
        proxy_ssl_server_name on;
        proxy_set_header Host image.tmdb.org;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }
}
