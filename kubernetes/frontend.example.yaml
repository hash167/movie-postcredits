# Same-origin frontend (nginx). Copy and set the image, then:
#   kubectl apply -f kubernetes/frontend.yaml
#
# Serves the UI and proxies:
#   /search /stats /health /movie/ /movies/tier/  -> movie-api:8000
#   /movies/ and *-movies.json                    -> minio:9000/movies/
#   /tmdb-image/                                  -> image.tmdb.org
#
# Phone clients should use http://<NODE_IP>:30080 (no extra NodePorts).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-frontend
  namespace: movie-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-frontend
  template:
    metadata:
      labels:
        app: movie-frontend
    spec:
      containers:
      - name: nginx
        image: your-dockerhub-username/movie-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: movie-frontend
  namespace: movie-api
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    name: http
  selector:
    app: movie-frontend
