# Publishes a SHA-tagged API image on main and on manual runs. Pull requests
# build the same image and do not push. This workflow does not talk to the
# Kubernetes API and does not store a kubeconfig.
name: Image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/movie-postcredits-api:${{ github.sha }}

  publish:
    name: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/movie-postcredits-api:${{ github.sha }}
